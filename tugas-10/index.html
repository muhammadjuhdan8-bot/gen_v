  <script>

// 1. Hitung luas segitiga dari alas dan tinggi
    let alas = 16.5;
    let tinggi = 8.5;

    let luas = 0.5 * alas * tinggi;

    console.log("Luas segitiga: " + luas);

// Maka hasilnya 70.13

// 3. Cetak bilangan genap dari 1 sampai 10

    for (let i = 1; i <= 10; i++) {
    if (i % 2 === 0) {
        console.log(i);
    }
}
// Maka hasilnya akan memunculkan angka genap mulai dari 2 sampai 10 seperti 2, 4, 6, 8, 10
