<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h4>1.Membuat Biodata Sederhana</h4>
    <br>
    <h4>2. Mengubah Nilai Variabel</h4>
    <script>
        // Membuat variabel biodata
let nama = "Muhammad Juhdan"; // Tipe data String (teks)
let umur = 18;                // Tipe data Number (angka)
let isSiswa = true;            // Tipe data Boolean (true/false)

// Menampilkan biodata ke layar
console.log("=== BIODATA SAYA ===");
console.log("Nama        :", nama);
console.log("Umur        :", umur);
console.log("Status Siswa:", isSiswa);

// Membuat variabel nilai ujian
let nilaiUjian = 70;

// Menampilkan nilai awal
console.log("Nilai awal:", nilaiUjian);

// Mengubah nilai variabel tanpa menggunakan let lagi
nilaiUjian = 85;

// Menampilkan nilai setelah diubah
console.log("Nilai baru:", nilaiUjian);
    </script>
</body>
</html>
