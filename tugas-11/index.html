
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Sederhana</title>
</head>
<body>

    <h4>1. Membuat Biodata Sederhana</h4>
    <h4>2. Mengubah Nilai Variabel</h4>

    <script>
        // Membuat variabel biodata
        let nama = "Muhammad Juhdan Alhakim";
        let namapanggilan = "juhdan";
        let ttl = "Bandung 12 Januari 2008";

        // Menggunakan tipe data angka/number karena berupa angka/nomor
        let umur = 18;
        // selesai tipe data angka

        let agama = "Islam";
        let isSiswa = true;

        // Menggunakan tipe data boolean karena terdapat logika antara true dan false
        let jeniskelamin = true;
        let status = false;

        // Menggunakan tipe data string karena ada tanda petik seperti '' atau ""
        let kewarganeraan = "Indonesia";
        let hobi = "Suka mencari hal baru, olahraga, belajar, jalan-jalan";
        let notlp = "08951234567";
        let email = "muhammdjuhdan1234@gmail.com"

        // Menampilkan biodata ke Console
        console.log("=== BIODATA SAYA ===");
        console.log("Nama           :", nama);
        console.log("Nama Panggilan :", namapanggilan);
        console.log("TTL            :", ttl);
        console.log("Umur           :", umur + " tahun, otw umur 19 nanti Januari");
        console.log("Agama          :", agama);
        console.log("Status Siswa   :", isSiswa);

        // Mengubah Boolean menjadi teks menggunakan ternary operator
        console.log("Jenis Kelamin  :", jeniskelamin ? "Laki-laki" : "Perempuan");
        console.log("Status         :", status ? "Sudah Menikah" : "Belum Menikah");

        console.log("Kewarganegaraan:", kewarganeraan);
        console.log("Hobi           :", hobi);
        console.log("No Telepon     :", notlp);
        console.log("Gmail          :", email)

        // Membuat variabel nilai ujian
        let nilaiUjian = 87;

        // Menampilkan nilai awal
        console.log("=== NILAI UJIAN JUHDAN===");
        console.log("Nilai awal:", nilaiUjian);

        // Mengubah nilai variabel
        nilaiUjian = 96;

        // Menampilkan nilai baru
        console.log("Nilai baru:", nilaiUjian);

    </script>

</body>
</html>
