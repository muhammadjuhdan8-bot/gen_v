<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tugas 05 JS</title>
</head>
<body>
    <script>

        // tugas 05 JS

        // Mencetak deret angka berurutan (For Loop)

        // 1. Menampilkan angka 1 sampai 10
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // 2. Menghitung mundur dari 5 sampai 1
        for (let i = 5; i >= 1; i--) {
            console.log(i);
        }

        // Mencetak teks setelah perulangan selesai
        console.log("Mulai!");

        // Menghitung total akumulasi angka (While Loop)


        // Membuat variabel awal
        let angka = 1;
        let total = 0;

        // Melakukan perulangan selama angka <= 5
        while (angka <= 5) {

            // Menambahkan angka ke total
            total = total + angka;

            // Menambah angka sebanyak 1
            angka++;
        }

        // Menampilkan hasil setelah perulangan selesai
        console.log("Total penjumlahan: " + total);


    </script>
</body>
</html>
