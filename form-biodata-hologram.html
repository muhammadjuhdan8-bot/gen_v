<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Biodata Mahasantri</title>
<style>
  :root {
    --cyan: #00f0ff;
    --magenta: #00f0ff;
    --violet: #00f0ff;
    --bg1: #02030a;
    --bg2: #07102a;
    --text: #00f0ff;
    --muted: #00f0ff;
    --glass: rgba(0, 240, 255, 0.06);
    --line: rgba(0, 240, 255, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 20% 10%, rgba(138, 92, 255, 0.28), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(255, 43, 214, 0.22), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(0, 240, 255, 0.10), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    padding: 48px 16px 64px;
    overflow-x: hidden;
    position: relative;
  }

  /* Grid perspektif di latar */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.12;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    animation: gridMove 12s linear infinite;
    pointer-events: none;
  }

  /* Scanline halus seluruh layar */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.03) 0,
      rgba(255, 255, 255, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 10;
  }

  @keyframes gridMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 48px, 48px 0; }
  }

  /* ===== Panel hologram ===== */
  .hologram {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 44px 44px;
    border-radius: 18px;
    background:
      linear-gradient(135deg, rgba(0, 240, 255, 0.10), rgba(138, 92, 255, 0.06) 50%, rgba(255, 43, 214, 0.08));
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
    box-shadow:
      0 0 0 1px rgba(0, 240, 255, 0.08) inset,
      0 0 40px rgba(0, 240, 255, 0.25),
      0 0 120px rgba(138, 92, 255, 0.25),
      0 30px 80px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    animation: flicker 7s infinite, floaty 6s ease-in-out infinite;
  }

  /* Sinar scan bergerak */
  .hologram::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 120px;
    top: -120px;
    background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.20), transparent);
    animation: scan 5s linear infinite;
    pointer-events: none;
  }

  /* Pantulan kilau diagonal */
  .hologram::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.07) 48%, transparent 60%);
    background-size: 250% 100%;
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes scan   { to { top: 100%; } }
  @keyframes shine  { 0% { background-position: 150% 0; } 60%, 100% { background-position: -50% 0; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.86; }
    94% { opacity: 1; }
    96% { opacity: 0.9; }
    97% { opacity: 1; }
  }

  /* Sudut bracket futuristik */
  .corner {
    position: absolute;
    width: 26px; height: 26px;
    border: 2px solid var(--cyan);
    filter: drop-shadow(0 0 6px var(--cyan));
    z-index: 2;
  }
  .corner.tl { top: 10px;    left: 10px;  border-right: 0; border-bottom: 0; }
  .corner.tr { top: 10px;    right: 10px; border-left: 0;  border-bottom: 0; }
  .corner.bl { bottom: 10px; left: 10px;  border-right: 0; border-top: 0; }
  .corner.br { bottom: 10px; right: 10px; border-left: 0;  border-top: 0; }

  /* ===== Judul ===== */
  .eyebrow {
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cyan);
    opacity: 0.85;
    margin-bottom: 10px;
  }

  h1 {
    text-align: center;
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--magenta));
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
    filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.55));
    margin-bottom: 8px;
  }

  .divider {
    height: 1px;
    margin: 18px auto 34px;
    width: 70%;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    box-shadow: 0 0 12px var(--cyan);
  }

  /* ===== Field ===== */
  .field {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 10px 22px;
    align-items: start;
    margin-bottom: 24px;
  }

  .field > .label,
  .field > label.label {
    padding-top: 13px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
  }

  .control {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--glass);
    transition: border-color .25s, box-shadow .25s, background .25s;
    overflow: hidden;
  }

  .control:focus-within {
    border-color: var(--cyan);
    background: rgba(0, 240, 255, 0.10);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 22px rgba(0, 240, 255, 0.45), 0 0 40px rgba(138, 92, 255, 0.25);
  }

  .icon {
    display: grid;
    place-items: center;
    width: 48px;
    flex: 0 0 48px;
    font-size: 1.05rem;
    color: var(--cyan);
    background: linear-gradient(180deg, rgba(0, 240, 255, 0.18), rgba(138, 92, 255, 0.12));
    border-right: 1px solid var(--line);
    text-shadow: 0 0 10px var(--cyan);
  }

  input[type="text"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    font: inherit;
    font-size: 0.98rem;
    color: var(--text);
    background: transparent;
    border: 0;
    outline: 0;
    padding: 13px 16px;
    letter-spacing: 0.03em;
  }

  input::placeholder, textarea::placeholder { color: rgba(127, 184, 201, 0.55); }

  textarea { resize: vertical; min-height: 120px; line-height: 1.5; }

  select {
    cursor: pointer;
    -webkit-appearance: none;
            appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--cyan) 50%),
      linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
    background-position: calc(100% - 22px) 55%, calc(100% - 16px) 55%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 44px;
  }
  select option { background: #08122e; color: var(--text); }

  /* ===== Radio & Checkbox sebagai chip holografik ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 4px; }

  .chip input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .chip label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px 10px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--muted);
    font-size: 0.92rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    transition: all .25s ease;
  }

  .chip label::before {
    content: "";
    width: 14px; height: 14px;
    border: 1.5px solid var(--cyan);
    border-radius: 50%;
    flex: 0 0 14px;
    transition: all .25s ease;
  }
  .chip.check label::before { border-radius: 4px; }

  .chip label:hover {
    color: var(--text);
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    transform: translateY(-1px);
  }

  .chip input:checked + label {
    color: #fff;
    border-color: var(--magenta);
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.22), rgba(255, 43, 214, 0.25));
    box-shadow: 0 0 20px rgba(244, 237, 243, 0.5), 0 0 40px rgba(0, 240, 255, 0.25) inset;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
  }
  .chip input:checked + label::before {
    background: radial-gradient(circle, #fff 0 35%, var(--magenta) 40% 100%);
    border-color: #fff;
    box-shadow: 0 0 10px var(--magenta);
  }

  .chip input:focus-visible + label {
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
  }

  /* ===== Tombol ===== */
  .actions { display: flex; justify-content: center; margin-top: 36px; }

  button[type="submit"] {
    position: relative;
    font: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    padding: 16px 54px 16px 60px;
    border: 1px solid var(--cyan);
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.30), rgba(138, 92, 255, 0.35), rgba(255, 43, 214, 0.30));
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.55), 0 0 60px rgba(138, 92, 255, 0.35);
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    overflow: hidden;
    transition: transform .2s ease, box-shadow .25s ease;
  }

  button[type="submit"]::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 40%;
    left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    transform: skewX(-20deg);
    transition: left .6s ease;
  }

  button[type="submit"]:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 34px rgba(0, 240, 255, 0.85), 0 0 90px rgba(250, 244, 249, 0.5);
  }
  button[type="submit"]:hover::after { left: 130%; }
  button[type="submit"]:active { transform: translateY(0) scale(0.99); }
  button[type="submit"]:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  .status {
    margin-top: 26px;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status span {
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 10px;
    border-radius: 50%;
    background: #39ff9c;
    box-shadow: 0 0 10px #39ff9c;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ===== Responsif ===== */
  @media (max-width: 680px) {
    .hologram { padding: 32px 20px 36px; }
    .field { grid-template-columns: 1fr; gap: 6px; }
    .field > .label, .field > label.label { padding-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<form class="hologram" action="#" method="post">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

  <p class="eyebrow">Sistem Pendataan</p>
  <h1>Form Biodata Mahasantri</h1>
  <div class="divider"></div>

  <div class="field">
    <label class="label" for="nama">Nama</label>
    <div class="control">
      <span class="icon">&#9672;</span>
      <input id="nama" name="nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name">
    </div>
  </div>

  <div class="field">
    <label class="label" for="nim">NIM</label>
    <div class="control">
      <span class="icon">&#9638;</span>
      <input id="nim" name="nim" type="text" placeholder="Nomor induk mahasantri" inputmode="numeric">
    </div>
  </div>

  <div class="field">
    <label class="label" for="email">Email</label>
    <div class="control">
      <span class="icon">&#9993;</span>
      <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email">
    </div>
  </div>

  <div class="field">
    <span class="label">Jurusan</span>
    <div class="chips">
      <div class="chip">
        <input type="radio" name="jurusan" id="jurusan_sd" value="SD">
        <label for="jurusan_sd">Software Development</label>
      </div>
      <div class="chip">
        <input type="radio" name="jurusan" id="jurusan_dm" value="DM">
        <label for="jurusan_dm">Digital Marketing</label>
      </div>
    </div>
  </div>

  <div class="field">
    <span class="label">Hobi</span>
    <div class="chips">
      <div class="chip check">
        <input type="checkbox" name="hobi[]" id="hobi_a" value="mancing">
        <label for="hobi_a">Mancing</label>
      </div>
      <div class="chip check">
        <input type="checkbox" name="hobi[]" id="hobi_b" value="olahraga">
        <label for="hobi_b">Olahraga</label>
      </div>
      <div class="chip check">
        <input type="checkbox" name="hobi[]" id="hobi_c" value="membaca">
        <label for="hobi_c">Membaca</label>
      </div>
      <div class="chip check">
        <input type="checkbox" name="hobi[]" id="hobi_d" value="menonton">
        <label for="hobi_d">Menonton</label>
      </div>
    </div>
  </div>

  <div class="field">
    <label class="label" for="matakuliah">Matakuliah</label>
    <div class="control">
      <span class="icon">&#9881;</span>
      <select id="matakuliah" name="matakuliah">
        <option value="WD">Web Design</option>
        <option value="DB">Database SQL</option>
        <option value="php">Pemrograman PHP</option>
        <option value="python">Pemrograman Python</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label class="label" for="alamat">Alamat</label>
    <div class="control">
      <textarea id="alamat" name="alamat" rows="5" placeholder="Tuliskan alamat lengkap"></textarea>
    </div>
  </div>

  <div class="actions">
    <button type="submit" name="submit">Submit</button>
  </div>

  <p class="status"><span></span>Sistem Online</p>
</form>

</body>
</html>
